yarnPath: .yarn/releases/yarn-4.18.1.cjs

# A plain node_modules folder; Astro, Playwright and Biome don't all support Plug'n'Play.
nodeLinker: node-modules

# Only install package versions that have been on the registry for at least 7 days.
npmMinimalAgeGate: 7d

# `yarn add` and `yarn up` pin exact versions.
defaultSemverRangePrefix: ""

# No usage data sent to Yarn, in line with the site's no-tracking rule.
enableTelemetry: false

# Don't look up @types packages through Algolia's search service on `yarn add`.
tsEnableAutoTypes: false

# Fixes for packages that don't declare everything they need. npm installs
# missing peer dependencies automatically, which hides these; Yarn doesn't.
packageExtensions:
  # Its WebAssembly runtime needs @emnapi/runtime, which it never lists.
  # Without this, `astro check` fails and asks to install @astrojs/check.
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": "1.11.3"
  # Passes TypeScript through to the Volar packages it uses.
  "@astrojs/language-server@*":
    peerDependencies:
      typescript: "*"
